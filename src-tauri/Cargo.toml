[package]
name = "recline-desktop"
version = "0.2.0-beta.1"
description = "Recline — privacy-first encrypted chat, calls, and communities (Open Beta desktop)"
authors = ["Recline contributors"]
edition = "2021"
license = "AGPL-3.0-only"

# binary the `cargo run` / `tauri dev` actually executes
[[bin]]
name = "recline-desktop"
path = "src/main.rs"

[lib]
name = "recline_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller release binaries
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
